services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  kiosk-server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"   # chỉ cho reverse proxy (nginx/Caddy) truy cập, KHÔNG mở thẳng ra Internet
    volumes:
      - ./data:/app/data
    env_file: .env

volumes:
  postgres-data:
