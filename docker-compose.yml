services:
  postgres:
    image: postgres:16-alpine
    container_name: vietqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vietqr_kiosk}
    ports:
      - "5433:5432" # Dùng port 5433 ở host để tránh xung đột với PostgreSQL service cài trên Windows
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vietqr_kiosk}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kiosk-net

  kiosk-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vietqr-kiosk-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=${POSTGRES_DB:-vietqr_kiosk};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Storage__Provider=${Storage__Provider:-Local}
      - Storage__Local__BaseDirectory=data/uploads
      - Storage__Local__PublicBaseUrl=/uploads
      - Storage__R2__AccountId=${Storage__R2__AccountId:-}
      - Storage__R2__AccessKeyId=${Storage__R2__AccessKeyId:-}
      - Storage__R2__SecretAccessKey=${Storage__R2__SecretAccessKey:-}
      - Storage__R2__BucketName=${Storage__R2__BucketName:-kiosk-assets}
      - Storage__R2__PublicDomain=${Storage__R2__PublicDomain:-}
    volumes:
      - ./server/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kiosk-net

  cms:
    build:
      context: ./fe-cms
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_KIOSK_API_KEY: ${Kiosk__ApiKey:-}
    container_name: vietqr-cms
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - kiosk-server
    networks:
      - kiosk-net

volumes:
  postgres_data:

networks:
  kiosk-net:
    driver: bridge
